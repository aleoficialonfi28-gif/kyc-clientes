<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - KYC CLIENTES</title>
  <!-- Google Fonts & Tailwind CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between selection:bg-indigo-600 selection:text-white relative">

  <!-- Subtle corporate ambient backdrop -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-[25%] left-1/2 -translate-x-1/2 w-[700px] h-[500px] bg-gradient-to-b from-indigo-950/20 to-transparent rounded-full blur-3xl"></div>
  </div>

  <!-- Minimal corporate header -->
  <header class="py-8 px-6 max-w-6xl mx-auto w-full flex items-center justify-center relative z-10">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center shadow-md">
        <i class="fa-solid fa-shield-halved text-indigo-400 text-lg"></i>
      </div>
      <div>
        <span class="text-xl font-bold tracking-tight text-white block leading-tight">
          KYC CLIENTES
        </span>
        <span class="text-[11px] text-slate-400 tracking-wider uppercase font-medium">Plataforma de Cumplimiento & Identidad</span>
      </div>
    </div>
  </header>

  <!-- Centered Login Box -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 relative z-10">
    <div class="max-w-[420px] w-full">

      <!-- Formal Auth Card -->
      <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-8 sm:p-9 shadow-2xl backdrop-blur-md">
        
        <div class="text-center mb-7">
          <h1 class="text-xl font-bold text-white tracking-tight">Iniciar Sesión</h1>
          <p class="text-xs text-slate-400 mt-1.5">Introduzca sus credenciales para acceder a la plataforma</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/25 text-rose-300 text-xs flex items-center space-x-2.5">
          <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm flex-shrink-0"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="username">
              Usuario
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                <i class="fa-regular fa-user"></i>
              </span>
              <input type="text" id="username" name="username" required autocomplete="username"
                     placeholder="Nombre de usuario"
                     class="w-full bg-[#070b13] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/40 transition">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-slate-300" for="password">
                Contraseña
              </label>
              <button type="button" id="toggle-pwd" class="text-slate-500 hover:text-slate-300 text-[11px] transition">
                <i class="fa-regular fa-eye mr-1"></i>Mostrar
              </button>
            </div>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                <i class="fa-solid fa-lock text-[11px]"></i>
              </span>
              <input type="password" id="password" name="password" required autocomplete="current-password"
                     placeholder="••••••••••••"
                     class="w-full bg-[#070b13] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/40 transition">
            </div>
          </div>

          <div class="pt-2">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition text-sm flex items-center justify-center space-x-2">
              <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
              <span>Ingresar al Sistema</span>
            </button>
          </div>
        </form>

      </div>

      <!-- Security Notice -->
      <div class="text-center mt-6">
        <p class="text-[11px] text-slate-500 flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-lock text-[10px]"></i>
          <span>Conexión cifrada de punto a punto &bull; Acceso restringido</span>
        </p>
      </div>

    </div>
  </main>

  <!-- Minimal Formal Footer -->
  <footer class="py-5 text-center text-xs text-slate-600 border-t border-slate-900/60 relative z-10">
    <p>KYC CLIENTES &copy; 2026 &bull; Todos los derechos reservados</p>
  </footer>

  <script>
    const toggleBtn = document.getElementById('toggle-pwd');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          toggleBtn.innerHTML = '<i class="fa-regular fa-eye-slash mr-1"></i>Ocultar';
        } else {
          pwdInput.type = 'password';
          toggleBtn.innerHTML = '<i class="fa-regular fa-eye mr-1"></i>Mostrar';
        }
      });
    }
  </script>
</body>
</html>
